name: Dev Server CI/CD

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop, feat/cicd ]

jobs:
  pr-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # 서브모듈 가져오기 활성화
          token: ${{ secrets.PROJECT_REPO_TOKEN }} # repo에 접근가능한 token 획득

      - name: Update Submodule
        run: git submodule update --remote

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Check Test Success
        run: ./gradlew test
        
      - name: Check Gradle Build Success
        run: ./gradlew build -x test

  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.PROJECT_REPO_TOKEN }} # repo에 접근가능한 token 획득

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: build without test
        run: ./gradlew clean build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jungil12532/nova-spring-app:latest
            jungil12532/nova-spring-app:${{ github.sha }}
          cache-from: type=registry,ref=jungil12532/nova-spring-app:buildcache
          cache-to: type=registry,ref=jungil12532/nova-spring-app:buildcache,mode=max

  deploy:
    needs: build-and-push # build-and-push job이 먼저 성공해야 depoly job 실행
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for Secrets # secrets.yaml을 submodule에서 가져옴
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PROJECT_REPO_TOKEN }}

      - name: Copy secrets to server via SCP # SCP로 secrets.yaml 파일을 서버로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: 22
          # 보낼 파일 위치 (GitHub Runner 기준)
          source: "docker/docker-compose.yml,docker/prometheus.yml,src/main/resources/config/secrets.yaml"
          # 받을 서버 위치 (자동으로 폴더가 생성되지 않을 수 있으니, 미리 존재하면 좋음)
          target: "/home/${{ secrets.REMOTE_USER }}/nova-server"

      - name: Deploy to Dev Server via SSH # SSH로 접속하여 Docker Compose 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: 22
          script: |
            # 작업 디렉토리로 이동
            cd /home/${{ secrets.REMOTE_USER }}/nova-server
            
            # secrets.yaml 위치 정리 (SCP로 온 파일 경로 정리)
            # source 구조가 그대로 복사되므로, docker-compose 옆으로 옮겨줍니다.
            mv src/main/resources/config/secrets.yaml ./secrets.yaml
            rm -rf src # 빈 폴더 정리
            
            # 이미지를 저장할 호스트 폴더 생성
            mkdir -p /home/${{ secrets.REMOTE_USER }}/images

            # 최신 이미지 Pull
            docker compose pull
            
            # 컨테이너 실행 (변경된 부분만 재생성됨)
            docker compose up -d --remove-orphans
            
            # 불필요한 이미지 정리
            docker image prune -f