version: '3.8'

services:
  # 1. Spring Boot 서버
  my-spring-app:
    image: jungil12532/nova-spring-app:latest  # Docker 이미지 주소
    container_name: nova-app
    volumes:
      - ./secrets.yaml:/app/config/secrets.yaml
      - ./images:/app/images
    ports:
      - "58080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:file:/app/config/secrets.yaml
      - TZ=Asia/Seoul  # (추천) 서버 시간 한국 시간으로 맞추기
    networks:
      - app-network

  # 2. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network

  # 3. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana  # 그래프 설정이 날아가지 않게 저장소 잡기
    networks:
      - app-network

  # 4. InfluxDB (k6 부하테스트 결과 저장용)
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    networks:
      - app-network

# 모든 컨테이너를 하나의 네트워크로 묶음 (서로 통신 가능하게)
networks:
  app-network:
    driver: bridge

# 그라파나 데이터를 영구 저장할 공간 생성
volumes:
  grafana-data: